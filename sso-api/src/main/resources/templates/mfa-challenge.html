<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Two-factor verification</title>
</head>
<body>
<h1>Two-factor verification</h1>

<p th:if="${errorMessage}" th:text="${errorMessage}" style="color: red;"></p>

<form th:action="@{/login/mfa}" th:object="${challengeForm}" method="post">
    <div>
        <label for="code" th:text="${mfaMethod == 'EMAIL_OTP'} ? 'Code from your e-mail' : 'Code from your authenticator app'"></label>
        <input type="text" id="code" th:field="*{code}" inputmode="numeric" autocomplete="one-time-code" />
    </div>
    <p>Lost access to your authenticator? Enter one of your recovery codes instead:</p>
    <div>
        <label for="recoveryCode">Recovery code</label>
        <input type="text" id="recoveryCode" th:field="*{recoveryCode}" autocomplete="off" />
    </div>
    <button type="submit">Verify</button>
</form>
</body>
</html>
