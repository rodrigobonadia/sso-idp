<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Sign in</title>
</head>
<body>
<h1>Sign in</h1>

<p th:if="${errorMessage}" th:text="${errorMessage}" style="color: red;"></p>
<p th:if="${param.logout}">You have been signed out.</p>
<p th:if="${param['password-reset']}">Your password has been reset. Please sign in.</p>
<p th:if="${param['password-changed']}">Your password has been changed. Please sign in.</p>

<form th:action="@{/login}" th:object="${loginForm}" method="post">
    <div>
        <label for="email">E-mail</label>
        <input type="email" id="email" th:field="*{email}" required="required" />
    </div>
    <div>
        <label for="password">Password</label>
        <input type="password" id="password" th:field="*{password}" required="required" />
    </div>
    <button type="submit">Sign in</button>
</form>
<p><a th:href="@{/forgot-password}">Forgot your password?</a></p>
</body>
</html>
