<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Create your account</title>
</head>
<body>
<h1>Create your account</h1>

<p th:if="${errorMessage}" th:text="${errorMessage}" style="color: red;"></p>

<form th:action="@{/register}" th:object="${registrationForm}" method="post">
    <div>
        <label for="email">E-mail</label>
        <input type="email" id="email" th:field="*{email}" required="required" />
    </div>
    <div>
        <label for="givenName">Given name</label>
        <input type="text" id="givenName" th:field="*{givenName}" required="required" />
    </div>
    <div>
        <label for="familyName">Family name</label>
        <input type="text" id="familyName" th:field="*{familyName}" required="required" />
    </div>
    <div>
        <label for="password">Password</label>
        <input type="password" id="password" th:field="*{password}" required="required" />
    </div>
    <button type="submit">Create account</button>
</form>
</body>
</html>
