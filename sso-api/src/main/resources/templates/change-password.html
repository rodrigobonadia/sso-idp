<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Change your password</title>
</head>
<body>
<h1>Change your password</h1>

<p th:if="${errorMessage}" th:text="${errorMessage}" style="color: red;"></p>

<form th:action="@{/account/change-password}" th:object="${changePasswordForm}" method="post">
    <div>
        <label for="currentPassword">Current password</label>
        <input type="password" id="currentPassword" th:field="*{currentPassword}" required="required" />
    </div>
    <div>
        <label for="newPassword">New password</label>
        <input type="password" id="newPassword" th:field="*{newPassword}" required="required" />
    </div>
    <button type="submit">Change password</button>
</form>
</body>
</html>
