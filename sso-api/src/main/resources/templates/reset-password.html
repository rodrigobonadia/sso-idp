<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Reset your password</title>
</head>
<body>
<h1>Reset your password</h1>

<p th:if="${errorMessage}" th:text="${errorMessage}" style="color: red;"></p>

<form th:action="@{/reset-password}" th:object="${resetPasswordForm}" method="post">
    <input type="hidden" th:field="*{token}" />
    <div>
        <label for="newPassword">New password</label>
        <input type="password" id="newPassword" th:field="*{newPassword}" required="required" />
    </div>
    <button type="submit">Reset password</button>
</form>
</body>
</html>
