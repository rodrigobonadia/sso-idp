<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>E-mail verification</title>
</head>
<body>
<div th:if="${success}">
    <h1>E-mail verified</h1>
    <p>The e-mail address <span th:text="${email}"></span> has been verified. You can now sign in.</p>
</div>
<div th:unless="${success}">
    <h1>Verification failed</h1>
    <p th:text="${errorMessage}"></p>
</div>
</body>
</html>
