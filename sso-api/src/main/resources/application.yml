spring:
  application:
    name: sso-api

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:sso}
    username: ${DB_USER:sso}
    password: ${DB_PASSWORD:sso}

  jpa:
    open-in-view: false
    hibernate:
      # Flyway is the single source of truth for the schema; Hibernate only validates that the
      # entity mappings match what Flyway already created - it must never auto-generate DDL.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  tenant:
    # Base domain used to resolve the tenant from a request's subdomain (e.g. with the default
    # below, a request to acme.localhost is resolved to the tenant whose slug is "acme"). In
    # production this should be set to the platform's real domain (e.g. ssoplatform.example) via
    # the TENANT_BASE_DOMAIN environment variable.
    base-domain: ${TENANT_BASE_DOMAIN:localhost}
  mail:
    # Scheme used when building links (e.g. e-mail verification) that point back at a tenant's
    # subdomain. Local development has no TLS, hence the "http" default; a real deployment should
    # set this to "https" via the MAIL_LINK_SCHEME environment variable.
    link-scheme: ${MAIL_LINK_SCHEME:http}
  signing-key:
    # Master secret used to encrypt/decrypt RSA private signing keys at rest (AES-256-GCM key
    # derived via SHA-256 of this value - see AesGcmPrivateKeyEncryptorAdapter). The default below
    # is for local development ONLY and provides no real protection - any real deployment MUST
    # override this via the SIGNING_KEY_ENCRYPTION_SECRET environment variable, with a strong,
    # randomly generated value kept out of the database entirely (see architecture_decisions.md,
    # decision (j)).
    encryption-secret: ${SIGNING_KEY_ENCRYPTION_SECRET:dev-only-insecure-default-change-me}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    root: INFO
    com.ssoplatform.idp: DEBUG
